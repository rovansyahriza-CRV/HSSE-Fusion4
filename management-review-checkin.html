<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Management Review — HSSE-Fusion4</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
.page{max-width:560px}.review-brief{background:#EEF2FC;border:1.5px solid #CFD9F5;border-radius:14px;padding:16px;margin-bottom:14px}.review-brief .title{font-weight:800;color:var(--navy-dark);font-size:17px}.review-brief .meta{font-size:12px;color:var(--muted);margin-top:5px}.btn-block{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}.id-gate-buttons{display:flex;gap:8px;flex-wrap:wrap}.id-gate-buttons button{flex:1;min-width:130px;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}.id-pin-form{display:none}.id-pin-form input{margin-bottom:8px}.attendee-list{margin-top:12px}.attendee-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}.empty{color:var(--muted);text-align:center;padding:22px}
</style>
</head>
<body><div class="page">
<a href="index.html" class="back-to-menu">⬅ Menu Utama</a>
<div class="header"><img src="header-banner.png" class="header-banner" alt="SMART HSSE Reporting System -- PT Bilal Mitra Aryatama"><div class="eyebrow">HSSE-Fusion4</div><h1>Absen Management Review</h1><p>Scan QR review ini, verifikasi identitas kamu, lalu tercatat sebagai peserta.</p></div>
<div id="status" class="status-msg"></div><div id="loading" class="card empty">Memuat info review...</div>
<div id="reviewArea" style="display:none"><div class="review-brief"><div class="title" id="agenda"></div><div class="meta" id="meta"></div><div class="meta">Peserta tercatat hadir: <b id="count">0</b></div></div>
<div class="card"><h2>Verifikasi Diri Kamu</h2><p style="margin:4px 0 12px">Scan QR badge, scan wajah, atau input PIN kamu sendiri.</p>
<div class="id-gate-buttons" id="gate"><button id="qrBtn" type="button">🪪 Scan QR Code</button><button id="faceBtn" type="button">🙂 Scan Wajah</button><button id="pinBtn" type="button">🔢 Input PIN</button></div>
<div class="id-pin-form" id="pinForm"><input id="pinInput" type="password" inputmode="numeric" placeholder="Masukkan PIN"><button class="btn-block" id="pinSubmit" type="button">Verifikasi PIN</button></div>
<div id="cam" style="display:none;position:relative;margin:12px auto;max-width:320px;aspect-ratio:1;background:#0B0D10;border-radius:14px;overflow:hidden"><video id="video" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video><canvas id="canvas" style="display:none"></canvas><div style="position:absolute;inset:20%;border:3px dashed var(--accent);border-radius:12px"></div></div><button id="faceScan" type="button" class="btn-block" style="display:none;margin-bottom:8px">📸 Scan Wajah</button>
<div class="button-row" style="margin-top:10px"><button id="cancelBtn" type="button" class="secondary" style="display:none">Batal</button></div></div>
<div class="card"><h2>Peserta yang Sudah Absen</h2><div id="list" class="attendee-list"></div></div></div>
</div>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),fusion=supabase.createClient(FUSION4_SUPABASE_URL,FUSION4_SUPABASE_KEY),$=id=>document.getElementById(id);let reviewId=null,stream=null,scan=false,refreshTimer=null,faceData=null;
document.addEventListener('DOMContentLoaded',async()=>{reviewId=new URLSearchParams(location.search).get('id');if(!reviewId)return show('ID review tidak ditemukan.','error');await loadInfo();$('qrBtn').onclick=startQr;$('faceBtn').onclick=startFace;$('faceScan').onclick=doFaceScan;$('pinBtn').onclick=showPin;$('pinSubmit').onclick=verifyPin;$('cancelBtn').onclick=cancel;});
function show(t,k='info'){$('status').className='status-msg '+k;$('status').textContent=t;$('status').style.display=t?'block':'none';}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function loadInfo(){try{const {data,error}=await db.rpc('get_management_review_checkin_info',{p_id:Number(reviewId)});if(error)throw error;if(!data||!data.found)throw new Error('Review tidak ditemukan.');if(['Completed','Cancelled'].includes(data.status))throw new Error('Review ini sudah ditutup.');$('loading').style.display='none';$('reviewArea').style.display='block';$('agenda').textContent=data.agenda;$('meta').textContent=`${data.namaProject} (${data.noKontrak}) · ${data.tanggalReview}`;render(data.participants||[]);refreshTimer=setInterval(refresh,4000);}catch(e){$('loading').textContent='❌ '+e.message;}}
async function refresh(){const {data}=await db.rpc('get_management_review_checkin_info',{p_id:Number(reviewId)});if(data&&data.found){$('count').textContent=(data.participants||[]).length;render(data.participants||[]);}}
function render(list){$('count').textContent=list.length;$('list').innerHTML=list.length?[...list].sort((a,b)=>new Date(a.jamHadir)-new Date(b.jamHadir)).map(p=>`<div class="attendee-row"><span>${esc(p.nama)}${p.jabatan?' -- '+esc(p.jabatan):''}</span><span>${new Date(p.jamHadir).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="empty">Belum ada peserta yang scan.</div>';}
function showPin(){$('gate').style.display='none';$('pinForm').style.display='block';$('cancelBtn').style.display='inline-block';$('pinInput').focus();}
function cancel(){stop();$('gate').style.display='flex';$('pinForm').style.display='none';$('faceScan').style.display='none';$('cancelBtn').style.display='none';}
async function verifyPin(){const pin=$('pinInput').value.trim();if(!pin)return show('Isi PIN dulu.','error');try{const {data,error}=await fusion.rpc('get_all_face_data');if(error)throw error;const p=(data||[]).find(x=>String(x.digitalPin||'').trim()===pin);if(!p)throw new Error('PIN tidak dikenali.');await checkin(p.nama,p.qrCodeId,p.kualifikasi||'');}catch(e){show(e.message,'error');}}
async function startQr(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('video').srcObject=stream;await $('video').play();$('cam').style.display='block';$('gate').style.display='none';$('cancelBtn').style.display='inline-block';scan=true;loop();}catch(e){show('Gagal akses kamera: '+e.message,'error');}}
async function startFace(){try{show('Memuat model wajah...','info');const u='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights';await faceapi.nets.tinyFaceDetector.loadFromUri(u);await faceapi.nets.faceLandmark68Net.loadFromUri(u);await faceapi.nets.faceRecognitionNet.loadFromUri(u);const {data,error}=await fusion.rpc('get_all_face_data');if(error)throw error;faceData=data||[];if(!faceData.length)throw new Error('Belum ada data wajah terdaftar.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});$('video').srcObject=stream;await $('video').play();$('cam').style.display='block';$('gate').style.display='none';$('faceScan').style.display='block';$('cancelBtn').style.display='inline-block';show('Posisikan wajah di kamera, lalu tekan Scan Wajah.','info');}catch(e){show(e.message,'error');cancel();}}
async function doFaceScan(){try{$('faceScan').disabled=true;const d=await faceapi.detectSingleFace($('video'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.3})).withFaceLandmarks().withFaceDescriptor();if(!d)throw new Error('Wajah tidak terdeteksi.');const ranked=faceData.map(p=>({p,distance:faceapi.euclideanDistance(d.descriptor,p.descriptor)})).sort((a,b)=>a.distance-b.distance),best=ranked[0],second=ranked[1];if(!best||best.distance>.45)throw new Error('Wajah tidak dikenali.');if(second&&second.distance-best.distance<.12)throw new Error('Wajah mirip lebih dari satu orang. Pakai QR Code atau PIN.');const p=best.p;cancel();await checkin(p.nama||p.NamaPersonnel,p.qrCodeId,p.kualifikasi||'');}catch(e){show(e.message,'error');$('faceScan').disabled=false;}}
async function loop(){const video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');while(scan){if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);const c=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height);if(c){let raw=c.data;try{const u=new URL(raw);raw=u.searchParams.get('QrCodeId')||u.searchParams.get('qrCodeId')||raw;}catch(_){}stop();try{const {data,error}=await fusion.rpc('get_person_face_data',{p_qrcode:raw.trim().toUpperCase()});if(error)throw error;if(!data||!data.person)throw new Error('QR tidak dikenali.');await checkin(data.person.nama||data.person.NamaPersonnel,data.person.qrCodeId||raw,data.person.kualifikasi||'');}catch(e){show(e.message,'error');}return;}}await new Promise(r=>setTimeout(r,120));}}
function stop(){scan=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$('cam').style.display='none';}
async function checkin(nama,qr,jabatan){const {data,error}=await db.rpc('checkin_management_review',{p_id:Number(reviewId),p_nama:nama,p_qrcode:qr,p_jabatan:jabatan});if(error)throw error;if(!data.success){show(data.duplicate?`${data.nama||nama} sudah tercatat sebagai peserta.`:data.message,'error');return;}show('✅ Berhasil tercatat sebagai peserta.','success');$('pinInput').value='';cancel();await refresh();}
</script>
</body></html>

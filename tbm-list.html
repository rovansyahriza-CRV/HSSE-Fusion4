<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Toolbox Meeting — HSSE-Fusion4</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  .page { max-width: 900px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--muted);
  }
  .filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .report-card { cursor: pointer; }
  .report-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .report-no { font-size: 12px; color: var(--muted); font-family: monospace; }
  .report-title { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .report-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .badges { display: flex; gap: 6px; flex-shrink: 0; }
  .detail-panel { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .detail-panel.open { display: block; }
  .detail-row { font-size: 13px; margin-bottom: 8px; }
  .detail-row b { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .detail-photo { max-width: 100%; border-radius: 10px; margin-top: 6px; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13px; }

  .status-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .status-badge.absen { background: #FDF3E3; color: #8A6100; }
  .status-badge.selesai { background: var(--success-bg); color: var(--success); }

  .permit-link-box {
    display: block; background: #E8F4FD; border-radius: 10px; padding: 10px 12px; font-size: 12.5px;
    font-weight: 700; color: #1E88E5; text-decoration: none; margin-top: 4px;
  }

  .peserta-count { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--navy); }

  .peserta-list-title { font-size: 11px; font-weight: 800; color: var(--navy); text-transform: uppercase;
    letter-spacing: 0.04em; margin: 14px 0 6px; }
  .peserta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
  .peserta-row:last-child { border-bottom: none; }
  .peserta-nama { font-weight: 600; }
  .peserta-nama .jabatan { color: var(--muted); font-weight: 500; }
  .peserta-jam { flex-shrink: 0; font-size: 11.5px; color: var(--muted); font-family: monospace; }
</style>
</head>
<body>

<div class="page">

  <a href="index.html" class="back-to-menu">⬅ Menu Utama</a>

  <div class="header">
    <img src="header-banner.png" class="header-banner" alt="Smart HSSE Reporting System">
    <div class="header-top">
      <img src="logo-bima.png" class="header-logo" alt="Logo BiMa">
      <div>
        <div class="eyebrow">HSSE-Fusion4</div>
        <h1>Riwayat Toolbox Meeting</h1>
      </div>
    </div>
    <p>Riwayat sesi briefing keselamatan sebelum kerja beserta daftar hadir peserta.</p>
    <a href="alur-tbm.pdf" target="_blank" class="pdf-link" style="margin-top:10px;">📄 Lihat Alur Proses (PDF)</a>
  </div>

  <div class="filter-row" id="filterRow">
    <button type="button" class="filter-btn active" data-status="" onclick="filterByStatus('', this)">Semua</button>
    <button type="button" class="filter-btn" data-status="Sedang Absen" onclick="filterByStatus('Sedang Absen', this)">🟡 Sedang Absen</button>
    <button type="button" class="filter-btn" data-status="Selesai" onclick="filterByStatus('Selesai', this)">✅ Selesai</button>
  </div>

  <div id="reportContainer">
    <div class="empty-state">Memuat data...</div>
  </div>

</div>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const fusion4Client = supabase.createClient(FUSION4_SUPABASE_URL, FUSION4_SUPABASE_KEY);
  let currentStatusFilter = '';
  let reports = [];
  let authorMap = {}; // qrCodeId -> Author gabungan (karyawanTbl + paswordTbl di Fusion4)

  let reportsLoadFailed = false;
  document.addEventListener('DOMContentLoaded', async () => {
    await Promise.all([loadAuthorMap(), loadReports()]);
    if (!reportsLoadFailed) renderReports(); // pastiin ke-render ulang pakai authorMap yg udah lengkap, gak peduli mana yg lebih dulu selesai
  });

  async function loadAuthorMap() {
    try {
      const { data, error } = await fusion4Client.rpc('get_all_karyawan_author');
      if (error) throw error;
      authorMap = {};
      (data || []).forEach(x => { if (x.qrCodeId) authorMap[x.qrCodeId] = x.author || ''; });
    } catch (e) {
      console.error('Gagal memuat data Author dari Fusion4:', e.message);
    }
  }
  function authorFor(qrCodeId) {
    if (!qrCodeId) return '';
    return authorMap[String(qrCodeId).toUpperCase().trim()] || '';
  }

  async function loadReports() {
    const container = document.getElementById('reportContainer');
    container.innerHTML = '<div class="empty-state">Memuat data...</div>';
    try {
      const { data, error } = await supabaseClient.rpc('get_tbm_list', {
        p_status: currentStatusFilter || null,
      });
      if (error) throw error;
      reports = data || [];
      renderReports();
    } catch (e) {
      reportsLoadFailed = true;
      container.innerHTML = `<div class="empty-state">❌ Gagal memuat data: ${e.message}</div>`;
    }
  }

  function filterByStatus(status, btnEl) {
    currentStatusFilter = status;
    document.querySelectorAll('#filterRow .filter-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    loadReports();
  }

  function statusBadgeHtml(r) {
    if (r.status === 'Selesai') return `<span class="status-badge selesai">✅ Selesai</span>`;
    return `<span class="status-badge absen">🟡 Sedang Absen</span>`;
  }

  function photoGalleryHtml(label, fotoArr) {
    if (!fotoArr || fotoArr.length === 0) return '';
    return `<div class="detail-row"><b>${label} (${fotoArr.length})</b><div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">${fotoArr.map(f => `<a href="${driveViewUrl(f)}" target="_blank" style="display:block; width:calc(33.33% - 4px); flex-shrink:0;"><img class="detail-photo" style="width:100%; aspect-ratio:1/1; object-fit:cover; margin-top:0;" src="${drivePhotoSrc(f)}" loading="lazy" onerror="this.onerror=null; this.src='${driveFallbackSrc(f)}';"></a>`).join('')}</div></div>`;
  }

  function pesertaListHtml(pesertaList) {
    if (!pesertaList || pesertaList.length === 0) {
      return '<div class="empty-state" style="padding:16px 0;">Belum ada peserta yang absen.</div>';
    }
    // urut terbaru absen paling atas
    const sorted = [...pesertaList].sort((a, b) => new Date(b.jamAbsen) - new Date(a.jamAbsen));
    return sorted.map(p => `
      <div class="peserta-row">
        <span class="peserta-nama">${escapeHtml(p.nama)}${p.qrCodeId ? ' ✅' : ''}${authorFor(p.qrCodeId) ? ' <span class="jabatan">[' + escapeHtml(authorFor(p.qrCodeId)) + ']</span>' : ''}</span>
        <span class="peserta-jam">${formatTime(p.jamAbsen)}</span>
      </div>
    `).join('');
  }

  function renderReports() {
    const container = document.getElementById('reportContainer');
    if (reports.length === 0) {
      container.innerHTML = '<div class="empty-state">Belum ada sesi Toolbox Meeting.</div>';
      return;
    }

    container.innerHTML = reports.map((r, idx) => {
      const jumlahPeserta = (r.pesertaList || []).length;
      return `
      <div class="card report-card">
        <div onclick="toggleDetail(${idx})">
          <div class="report-top">
            <div>
              <div class="report-no">${r.noSesi}</div>
              <div class="report-title">${escapeHtml(r.topikBriefing)}</div>
              <div class="report-meta">${formatDate(r.tanggalMulai)} • ${escapeHtml(r.lokasiArea)} • ${escapeHtml(r.namaProject)} (${escapeHtml(r.noKontrak)})</div>
              <div class="report-meta">Leader: ${escapeHtml(r.leaderNama)}${r.leaderQrCodeId ? ' ✅' : ''}${authorFor(r.leaderQrCodeId) ? ' (' + escapeHtml(authorFor(r.leaderQrCodeId)) + ')' : ''}</div>
            </div>
            <div class="badges" style="flex-direction: column; align-items: flex-end;">
              ${statusBadgeHtml(r)}
              <span class="peserta-count">👥 ${jumlahPeserta}</span>
            </div>
          </div>
        </div>
        <div class="detail-panel" id="detail-${idx}">
          ${r.permitNoPermit ? `<a href="ptw-list.html" target="_blank" class="permit-link-box" onclick="event.stopPropagation()">🔗 Terkait Permit to Work No. ${escapeHtml(r.permitNoPermit)} -- klik buat buka Riwayat PTW</a>` : ''}
          <div class="peserta-list-title">Daftar Hadir (${jumlahPeserta})</div>
          ${pesertaListHtml(r.pesertaList)}
          ${r.status === 'Selesai' ? `
            ${r.catatanPenutup ? `<div class="detail-row" style="margin-top:10px;"><b>Catatan Penutup</b>${escapeHtml(r.catatanPenutup)}</div>` : ''}
            <div class="detail-row" style="margin-top:10px;"><b>Selesai Pada</b>${formatDate(r.tanggalSelesai)}</div>
            ${photoGalleryHtml('Foto Dokumentasi', r.fotoPenutupList)}
          ` : ''}
        </div>
      </div>
    `;
    }).join('');
  }

  function toggleDetail(idx) {
    const panel = document.getElementById('detail-' + idx);
    panel.classList.toggle('open');
  }

  function formatDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
      d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function formatTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  function drivePhotoSrc(f) {
    if (!f) return '';
    if (f.fileId) return `https://drive.google.com/thumbnail?id=${f.fileId}&sz=w1000`;
    return f.url || '';
  }
  function driveFallbackSrc(f) {
    if (!f) return '';
    if (f.fileId) return `https://lh3.googleusercontent.com/d/${f.fileId}=w1000`;
    return f.url || '';
  }
  function driveViewUrl(f) {
    if (!f) return '#';
    if (f.fileId) return `https://drive.google.com/file/d/${f.fileId}/view`;
    return f.url || '#';
  }
</script>

</body>
</html>

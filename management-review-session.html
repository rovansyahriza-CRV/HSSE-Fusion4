<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Management Review — Layar Absen — HSSE-Fusion4</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--navy:#2D3C73;--dark:#1B2650;--yellow:#F5A623;--muted:#C7CEE8}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;font-family:'Plus Jakarta Sans',sans-serif}body{background:linear-gradient(135deg,var(--dark),var(--navy));color:#fff;padding:28px}.wrap{width:100%;max-width:1200px;margin:auto}.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}.top img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fff;padding:4px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:800}.top h1{font-size:26px;margin-top:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:22px;padding:28px}.code{font-family:monospace;font-size:13px;color:var(--yellow);font-weight:700}.title{font-size:22px;font-weight:800;margin-top:4px}.meta{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.7}.qr{text-align:center;margin-top:24px}.frame{display:inline-block;background:#fff;padding:18px;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.25)}.frame canvas{display:block}.hint{margin-top:16px;font-size:15px;font-weight:700}.link{margin-top:8px;font-size:12px;color:#9CA8C9;word-break:break-all}.count{text-align:center;margin-bottom:18px}.count b{display:block;font-size:56px;line-height:1;color:var(--yellow)}.count span{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.list{max-height:420px;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:8px;font-size:15px;font-weight:600}.row small{color:#9CA8C9;font-weight:500;flex-shrink:0}.empty{text-align:center;color:#9CA8C9;padding:40px 10px}.finished{background:#E5F6EC;color:#178A4C;border-radius:16px;padding:24px;text-align:center;font-weight:800;margin-top:24px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div id="loading" class="empty">Memuat sesi...</div><div id="error" class="empty" style="display:none"></div><main id="main" style="display:none"><div class="top"><img src="logo-bima.png" alt="Logo BiMa"><div><div class="eyebrow">HSSE-Fusion4</div><h1>Management Review — Layar Absen</h1></div></div><div class="grid"><section class="panel"><div class="code" id="code"></div><div class="title" id="agenda"></div><div class="meta"><div id="project"></div><div id="location"></div><div id="date"></div></div><div id="qrArea" class="qr"><div class="frame"><canvas id="qr"></canvas></div><div class="hint">Scan QR ini pakai HP buat absen hadir</div><div class="link" id="url"></div></div><div id="finished" class="finished" style="display:none">✅ Review sudah selesai — absen ditutup.</div></section><section class="panel"><div class="count"><b id="count">0</b><span>Peserta Hadir</span></div><div id="list" class="list"></div></section></div></main></div>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);let timer,qrDone=false;function fail(t){$('loading').style.display='none';$('error').style.display='block';$('error').textContent='❌ '+t}function time(v){return v?new Date(v).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(list){$('count').textContent=list.length;$('list').innerHTML=list.length?[...list].sort((a,b)=>new Date(b.jamHadir)-new Date(a.jamHadir)).map(p=>`<div class="row"><span>${esc(p.nama)}${p.jabatan?' <small>-- '+esc(p.jabatan)+'</small>':''}</span><small>${time(p.jamHadir)}</small></div>`).join(''):'<div class="empty">Belum ada peserta yang scan.</div>'}async function refresh(){const{data,error}=await db.rpc('get_management_review_checkin_info',{p_id:Number(id)});if(error)throw error;if(!data||!data.found)return fail('Review tidak ditemukan.');$('code').textContent='Management Review #'+data.id;$('agenda').textContent=data.agenda||'Management Review';$('project').textContent=`${data.namaProject||''}${data.noKontrak?' ('+data.noKontrak+')':''}`;$('location').textContent=data.lokasi?'📍 '+data.lokasi:'';$('date').textContent=data.tanggalReview?'🗓️ '+data.tanggalReview:'';render(data.participants||[]);if(data.status==='Completed'||data.status==='Cancelled'){$('qrArea').style.display='none';$('finished').style.display='block';clearInterval(timer)}else if(!qrDone){const url=`${location.origin}${location.pathname.replace('management-review-session.html','management-review-checkin.html')}?id=${encodeURIComponent(id)}`;$('url').textContent=url;QRCode.toCanvas($('qr'),url,{width:320,margin:1});qrDone=true}$('loading').style.display='none';$('main').style.display='block'}if(!id)fail('ID review tidak ditemukan.');else{refresh().catch(e=>fail(e.message));timer=setInterval(()=>refresh().catch(e=>console.error(e)),4000)}
</script></body></html>
